name: Scrape TNA Roster

on:
  push:
  workflow_dispatch:
  schedule:
  - cron:  '7 * * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: roster-scraper/package-lock.json
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright/
        key: ${{ runner.os }}-playwright-${{ hashFiles('roster-scraper/package-lock.json') }}
    - name: Install dependencies
      run: npm install
      working-directory: roster-scraper
    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps
      working-directory: roster-scraper
    - name: Scrape Roster
      run: ${GITHUB_WORKSPACE}/roster-scraper/tna/scrape-tna.sh
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "TNA Roster Change - ${timestamp}" || exit 0
        git pull --rebase
        git push
