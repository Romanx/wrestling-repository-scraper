name: Scrape AEW Roster

on:
  push:
  workflow_dispatch:
  schedule:
  - cron:  '3 * * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: roster-scraper/package-lock.json
    # No browser needed: scrape-aew.ts uses fetch against the page and /api/wrestlers.
    - name: Install dependencies
      run: npm install
      working-directory: roster-scraper
    - name: Scrape Roster
      run: ${GITHUB_WORKSPACE}/roster-scraper/aew/scrape-aew.sh
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "AEW Roster Change - ${timestamp}" || exit 0
        git pull --rebase
        git push
