name: Scrape WWE Roster

on:
  push:
  workflow_dispatch:
  schedule:
  - cron:  '12 * * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: roster-scraper/package-lock.json
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright/
        key: ${{ runner.os }}-playwright-${{ hashFiles('roster-scraper/package-lock.json') }}
    - name: Install dependencies
      run: npm install
      working-directory: roster-scraper
    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps
      working-directory: roster-scraper
    - name: Scrape Roster
      run: ${GITHUB_WORKSPACE}/roster-scraper/wwe/scrape-wwe.sh
    # Runs on every branch push so the scraper is exercised, but only main writes
    # to the archive: a feature branch run would otherwise push a commit back onto
    # the branch and into the open PR.
    - name: Commit and push
      if: github.ref == 'refs/heads/main'
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "WWE Roster Change - ${timestamp}" || exit 0
        git pull --rebase
        git push
